name: Build Cross-Platform Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/邻传-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Connections-Windows-x64
          path: dist/邻传-Windows-x64.zip

  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS Release
        run: flutter build macos --release
      - name: Package macOS DMG
        run: |
          mkdir -p dist
          hdiutil create -volname "邻传" -srcfolder "build/macos/Build/Products/Release/Connections.app" -ov -format UDZO "dist/邻传-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Connections-macOS
          path: dist/邻传-macOS.dmg

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android Release APK
        run: flutter build apk --release
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/邻传-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Connections-Android-APK
          path: dist/邻传-Android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "邻传 (Connections) ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          body: |
            ### 邻传 (Connections) 跨平台生产发行版
            - **Windows (x64)**: `邻传-Windows-x64.zip`（解压后运行 `connections.exe`）
            - **macOS (Apple Silicon)**: `邻传-macOS.dmg`
            - **Android**: `邻传-Android.apk`
          files: release-assets/*
